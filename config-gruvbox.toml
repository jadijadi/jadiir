# Theme: Gruvbox — https://github.com/schnerring/hugo-theme-gruvbox
# A Hugo module, vendored into _vendor/. Needs `npm install` once for fonts, icons and Prism.

[params]
  author = "Jadi Mirmirani"
  defaultTheme = "dark"      # dark / light (OS + user preference override)
  themeColor = "orange"      # gray red green yellow blue purple aqua orange
  themeContrast = "medium"   # soft medium hard
  [params.logo]
    text = "jadi"
    url = "/"
  [params.prism]
    languages = ["markup", "bash"]
    plugins = ["normalize-whitespace", "toolbar", "copy-to-clipboard"]
  [params.tagCloud]
    enable = false

[build]
  _merge = "deep"

[outputs]
  home = ["html", "rss", "searchIndex"]

[module]
  [[module.imports]]
    path = "github.com/schnerring/hugo-theme-gruvbox"
  [[module.imports]]
    path = "github.com/schnerring/hugo-mod-json-resume"
    [[module.imports.mounts]]
      source = "layouts"
      target = "layouts"
    [[module.imports.mounts]]
      source = "assets/css/json-resume.css"
      target = "assets/css/critical/44-json-resume.css"
  [[module.mounts]]
    source = "node_modules/simple-icons/icons"
    target = "assets/simple-icons"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "layouts-gruvbox"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "node_modules/prismjs"
    target = "assets/prismjs"
  [[module.mounts]]
    source = "node_modules/prism-themes/themes"
    target = "assets/prism-themes"
  [[module.mounts]]
    source = "node_modules/typeface-fira-code/files"
    target = "static/fonts"
  [[module.mounts]]
    source = "node_modules/typeface-roboto-slab/files"
    target = "static/fonts"
  [[module.mounts]]
    source = "node_modules/@tabler/icons/icons"
    target = "assets/tabler-icons"
  [[module.mounts]]
    source = "hugo_stats.json"
    target = "assets/watching/hugo_stats.json"
