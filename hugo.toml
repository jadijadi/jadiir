# Shared site config. Pick a theme by adding its config file, e.g.:
#   hugo server --config hugo.toml,config-gruvbox.toml
# or simply `make serve THEME=gruvbox` (see Makefile / notes.txt).

baseURL = "https://jadi.space/"
locale = "en-US"
title = "Jadi"
copyright = "© Jadi Mirmirani"

enableRobotsTXT = true

# Declared explicitly so themes that ship multi-language demo configs don't add languages
[languages]
  [languages.en]
    label = "English"
    weight = 1

[pagination]
  pagerSize = 10

[params]
  description = "Essential info about Jadi Mirmirani: contact, links and ways to support."
  mainSections = ["blog"]

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1
[[menu.main]]
  name = "Blog"
  url = "/blog/"
  weight = 2
[[menu.main]]
  name = "Contact"
  url = "/contact/"
  weight = 3
[[menu.main]]
  name = "Links"
  url = "/links/"
  weight = 4
[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 5
[[menu.main]]
  name = "Support"
  url = "/support/"
  weight = 6

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[taxonomies]
  tag = "tags"
